<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      
      <g filter="url(#dropShadow)" transform="translate(15, 20)">
        <!-- Forro e acolchoamento gambeson sob as talas -->
        <path d="M 50 55 L 220 55 L 210 335 L 60 335 Z" fill="#2d1d13" />

        <!-- Ombros articulados em placas -->
        <path d="M 40 55 C 65 40, 105 45, 105 75 L 45 95 Z" fill="url(#darkSteel)" stroke="#0f172a" stroke-width="1.5" />
        <path d="M 230 55 C 205 40, 165 45, 165 75 L 225 95 Z" fill="url(#darkSteel)" stroke="#0f172a" stroke-width="1.5" />

        <!-- TALAS VERTICAIS DE AÇO RÍGIDAS (Splints) -->
        <!-- Tala 1 -->
        <rect x="68" y="70" width="16" height="250" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala 2 -->
        <rect x="88" y="65" width="16" height="255" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala 3 -->
        <rect x="108" y="60" width="16" height="260" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala Central 4 -->
        <rect x="128" y="58" width="16" height="262" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala 5 -->
        <rect x="148" y="60" width="16" height="260" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala 6 -->
        <rect x="168" y="65" width="16" height="255" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />
        <!-- Tala 7 -->
        <rect x="188" y="70" width="16" height="250" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1.5" rx="2" />

        <!-- Brilhos reflexivos nas bordas das talas -->
        <line x1="70" y1="72" x2="70" y2="315" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />
        <line x1="90" y1="67" x2="90" y2="318" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />
        <line x1="110" y1="62" x2="110" y2="320" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />
        <line x1="130" y1="60" x2="130" y2="320" stroke="#f8fafc" stroke-width="1.5" opacity="0.7" />
        <line x1="150" y1="62" x2="150" y2="320" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />
        <line x1="170" y1="67" x2="170" y2="318" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />
        <line x1="190" y1="72" x2="190" y2="315" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />

        <!-- Rebites de latão fixando as talas nas tiras de couro transversais -->
        <!-- Fileira Superior de Rebites -->
        <circle cx="76" cy="85" r="2.5" fill="url(#brassGrad)" />
        <circle cx="96" cy="80" r="2.5" fill="url(#brassGrad)" />
        <circle cx="116" cy="75" r="2.5" fill="url(#brassGrad)" />
        <circle cx="136" cy="73" r="2.5" fill="url(#brassGrad)" />
        <circle cx="156" cy="75" r="2.5" fill="url(#brassGrad)" />
        <circle cx="176" cy="80" r="2.5" fill="url(#brassGrad)" />
        <circle cx="196" cy="85" r="2.5" fill="url(#brassGrad)" />

        <!-- Fileira Média de Rebites -->
        <circle cx="76" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="96" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="116" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="136" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="156" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="176" cy="170" r="2.5" fill="url(#brassGrad)" />
        <circle cx="196" cy="170" r="2.5" fill="url(#brassGrad)" />

        <!-- Fileira Inferior de Rebites -->
        <circle cx="76" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="96" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="116" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="136" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="156" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="176" cy="290" r="2.5" fill="url(#brassGrad)" />
        <circle cx="196" cy="290" r="2.5" fill="url(#brassGrad)" />

        <!-- Correias de couro com fivelas unindo o peitoral -->
        <rect x="62" y="195" width="148" height="12" fill="#3b1d11" stroke="#1c0f08" stroke-width="1" />
        <rect x="122" y="191" width="28" height="20" fill="none" stroke="url(#brassGrad)" stroke-width="3" rx="2" />
      </g>
    </svg>