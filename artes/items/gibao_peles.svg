<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      
      <g filter="url(#dropShadow)" transform="translate(15, 25)">
        <!-- Base de peles grossas e felpudas irregulares -->
        <path d="M 50 60 C 70 40, 100 45, 135 55 C 170 45, 200 40, 220 60 C 235 90, 215 130, 205 150 C 215 220, 210 300, 195 330 C 160 340, 110 340, 75 330 C 60 300, 55 220, 65 150 C 55 130, 35 90, 50 60 Z" fill="#3f2719" stroke="#1e120a" stroke-width="3" />

        <!-- Pelagem e textura de pelos de urso/lobo -->
        <g stroke="#61412b" stroke-width="2" stroke-linecap="round" opacity="0.8">
          <path d="M 70 80 Q 60 95 55 115" />
          <path d="M 85 75 Q 80 95 75 120" />
          <path d="M 200 80 Q 210 95 215 115" />
          <path d="M 185 75 Q 190 95 195 120" />
          <path d="M 90 160 Q 80 185 85 210" />
          <path d="M 115 170 Q 110 195 112 220" />
          <path d="M 155 170 Q 160 195 158 220" />
          <path d="M 180 160 Q 190 185 185 210" />
          <path d="M 90 260 Q 85 285 80 310" />
          <path d="M 175 260 Q 180 285 185 310" />
        </g>

        <!-- Camadas sobrepostas de couro cru com costura de tendão -->
        <path d="M 85 110 L 185 110 L 180 230 L 90 230 Z" fill="#6d4126" stroke="#231309" stroke-width="2.5" />
        <line x1="90" y1="120" x2="180" y2="120" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" />
        <line x1="90" y1="220" x2="180" y2="220" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" />

        <!-- Tiras cruzadas de couro cru e presilhas de osso/dente de fera -->
        <line x1="80" y1="100" x2="190" y2="240" stroke="#1e120a" stroke-width="6" />
        <line x1="190" y1="100" x2="80" y2="240" stroke="#1e120a" stroke-width="6" />
        <circle cx="135" cy="170" r="12" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
        <circle cx="135" cy="170" r="4" fill="#0f172a" />
      </g>
    </svg>