<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      <circle cx="150" cy="130" r="90" fill="#eab308" opacity="0.06" filter="url(#forgeGlow)" />

      <g filter="url(#dropShadow)" transform="rotate(25 150 200)">
        <!-- Cabo de carvalho reforçado com tiras de ferro -->
        <rect x="144" y="110" width="12" height="230" fill="url(#woodGrad)" rx="3" stroke="#291206" stroke-width="2" />

        <!-- Tiras de couro cruzadas na empunhadura -->
        <g stroke="#1c1917" stroke-width="2" opacity="0.7">
          <line x1="144" y1="260" x2="156" y2="270" />
          <line x1="144" y1="275" x2="156" y2="285" />
          <line x1="144" y1="290" x2="156" y2="300" />
          <line x1="144" y1="305" x2="156" y2="315" />
          <line x1="156" y1="260" x2="144" y2="270" />
          <line x1="156" y1="275" x2="144" y2="285" />
          <line x1="156" y1="290" x2="144" y2="300" />
          <line x1="156" y1="305" x2="144" y2="315" />
        </g>

        <!-- Pomo cônico inferior pesado -->
        <polygon points="150,355 138,340 162,340" fill="url(#brassGrad)" stroke="#451a03" stroke-width="1.5" />
        <circle cx="150" cy="355" r="4" fill="url(#steelGrad)" />

        <!-- Colar de anéis de reforço no topo do cabo -->
        <rect x="141" y="115" width="18" height="6" fill="url(#brassGrad)" rx="1" />
        <rect x="142" y="125" width="16" height="5" fill="url(#steelGrad)" rx="1" />

        <!-- CABEÇA DA MAÇA FLANGEADA (6 Flanges Caneladas Espessas) -->
        <!-- Flange Esquerda -->
        <path d="M 144 65 C 105 70, 95 95, 105 115 C 120 120, 135 115, 144 110 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
        <path d="M 144 75 C 115 80, 110 95, 115 110" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />

        <!-- Flange Direita -->
        <path d="M 156 65 C 195 70, 205 95, 195 115 C 180 120, 165 115, 156 110 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
        <path d="M 156 75 C 185 80, 190 95, 185 110" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.6" />

        <!-- Flanges Centrais Frontais -->
        <path d="M 146 55 L 154 55 L 160 120 L 140 120 Z" fill="url(#darkSteel)" stroke="#0f172a" stroke-width="1.5" />
        <path d="M 147 60 C 135 80, 135 100, 147 115 L 153 115 C 165 100, 165 80, 153 60 Z" fill="url(#steelGrad)" stroke="#334155" stroke-width="2" />

        <!-- Espigão de Perfuração Superior (Crowning Spike) -->
        <polygon points="150,30 144,55 156,55" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
        <line x1="150" y1="32" x2="150" y2="55" stroke="#f8fafc" stroke-width="1.5" />
      </g>
    </svg>