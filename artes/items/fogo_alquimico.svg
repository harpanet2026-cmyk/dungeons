<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      <!-- Brilho verde efervescente de fogo alquímico -->
      <circle cx="150" cy="220" r="110" fill="#10b981" opacity="0.15" filter="url(#forgeGlow)" />
      <circle cx="150" cy="220" r="70" fill="#f59e0b" opacity="0.12" filter="url(#forgeGlow)" />

      <g filter="url(#dropShadow)">
        <!-- Rolha de cortiça e anéis de lacre de cera escura -->
        <polygon points="138,80 162,80 158,105 142,105" fill="#a16207" stroke="#451a03" stroke-width="2" />
        <circle cx="150" cy="85" r="4" fill="#dc2626" />

        <!-- Gargalo de vidro grosso de alquimista com anel de reforço -->
        <rect x="140" y="105" width="20" height="45" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.8" />
        <path d="M 135 110 L 165 110" stroke="url(#brassGrad)" stroke-width="4" />

        <!-- Cordão de barbante e pergaminho de advertência amarrado -->
        <path d="M 138 125 C 130 135, 125 150, 120 165" stroke="#fde047" stroke-width="2" fill="none" />
        <rect x="105" y="150" width="22" height="30" fill="#fef08a" stroke="#78350f" stroke-width="1" rx="1" transform="rotate(-15 116 165)" />
        <line x1="110" y1="158" x2="124" y2="158" stroke="#78350f" stroke-width="1.5" transform="rotate(-15 116 165)" />
        <line x1="110" y1="165" x2="124" y2="165" stroke="#dc2626" stroke-width="1.5" transform="rotate(-15 116 165)" />

        <!-- FRASCO ESFÉRICO DE VIDRO RESISTENTE -->
        <circle cx="150" cy="230" r="80" fill="none" stroke="#cbd5e1" stroke-width="4" opacity="0.85" />
        <!-- Líquido químico verde-esmeralda efervescente -->
        <path d="M 75 235 C 75 295, 225 295, 225 235 C 200 245, 170 225, 150 240 C 130 255, 100 225, 75 235 Z" fill="#059669" opacity="0.9" />
        <path d="M 85 245 C 85 285, 215 285, 215 245 Z" fill="#10b981" opacity="0.75" />

        <!-- Bolhas efervescentes e fagulhas alquímicas de fósforo -->
        <circle cx="130" cy="255" r="6" fill="#fef08a" opacity="0.9" />
        <circle cx="165" cy="270" r="4" fill="#fef08a" opacity="0.9" />
        <circle cx="150" cy="250" r="5" fill="#fde047" opacity="0.95" />
        <circle cx="115" cy="275" r="3" fill="#a7f3d0" opacity="0.8" />
        <circle cx="180" cy="250" r="4" fill="#a7f3d0" opacity="0.8" />

        <!-- Reflexos curvos de luz no vidro -->
        <path d="M 95 190 C 85 210, 85 245, 95 265" fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.6" />
        <path d="M 105 180 C 120 165, 135 160, 150 160" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" opacity="0.4" />
      </g>
    </svg>