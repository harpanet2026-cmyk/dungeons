<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      <circle cx="140" cy="120" r="95" fill="#f59e0b" opacity="0.07" filter="url(#forgeGlow)" />

      <g filter="url(#dropShadow)" transform="rotate(-30 150 200)">
        <!-- Cabo longo de madeira de lei -->
        <rect x="144" y="80" width="12" height="260" fill="url(#woodGrad)" rx="2" stroke="#271105" stroke-width="2" />

        <!-- Tiras laterais de aço (Langets) que protegem o cabo de corte de espadas -->
        <rect x="143" y="80" width="2" height="120" fill="url(#steelGrad)" />
        <rect x="155" y="80" width="2" height="120" fill="url(#steelGrad)" />
        <!-- Rebites nas talas -->
        <circle cx="144" cy="95" r="1.5" fill="#f8fafc" />
        <circle cx="144" cy="125" r="1.5" fill="#f8fafc" />
        <circle cx="144" cy="155" r="1.5" fill="#f8fafc" />

        <!-- Empunhadura de couro enrolado -->
        <rect x="143" y="240" width="14" height="80" fill="url(#leatherGrad)" rx="2" />
        <!-- Pomo de ferro pesado na base -->
        <circle cx="150" cy="345" r="10" fill="url(#steelGrad)" stroke="#0f172a" stroke-width="2" />

        <!-- CABEÇA DO MARTELO (Bloco pesado de impacto de um lado, Bico de Corvo do outro) -->
        <!-- Bloco de Impacto (Face Esquerda com ranhuras em pirâmide) -->
        <path d="M 144 82 L 80 88 L 75 92 L 75 118 L 80 122 L 144 128 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
        <!-- Ranhuras de impacto na face do martelo -->
        <line x1="75" y1="96" x2="75" y2="114" stroke="#0f172a" stroke-width="3" />
        <rect x="73" y="94" width="3" height="4" fill="#f8fafc" />
        <rect x="73" y="102" width="3" height="4" fill="#f8fafc" />
        <rect x="73" y="110" width="3" height="4" fill="#f8fafc" />

        <!-- Anel central de fixação na madeira -->
        <rect x="140" y="80" width="20" height="50" fill="url(#brassGrad)" rx="3" stroke="#451a03" stroke-width="1.5" />

        <!-- Bico de Corvo Perfurador de Armaduras (Face Direita / Bec de Corbin) -->
        <path d="M 160 88 C 190 92, 220 105, 235 125 C 215 120, 185 122, 160 126 Z" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2" />
        <path d="M 162 93 C 190 97, 215 110, 230 124" fill="none" stroke="#f8fafc" stroke-width="1.5" opacity="0.7" />

        <!-- Espigão superior central -->
        <polygon points="150,55 145,80 155,80" fill="url(#steelGrad)" stroke="#0f172a" stroke-width="1.5" />
      </g>
    </svg>