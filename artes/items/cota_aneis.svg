<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      
      <g filter="url(#dropShadow)" transform="translate(15, 25)">
        <!-- Suporte de madeira / Cabideiro -->
        <path d="M 85 30 L 135 15 L 185 30 L 135 40 Z" fill="url(#woodGrad)" />

        <!-- Colete base de couro cru espesso (Dark Leather) -->
        <path d="M 60 50 L 105 45 L 135 60 L 165 45 L 210 50 L 225 120 L 200 135 L 195 320 L 75 320 L 70 135 L 45 120 Z" fill="url(#leatherGrad)" stroke="#1c1917" stroke-width="3" />

        <!-- Costuras e bainhas de couro reforçado -->
        <line x1="75" y1="52" x2="75" y2="318" stroke="#1c1917" stroke-width="2" stroke-dasharray="4,4" />
        <line x1="195" y1="52" x2="195" y2="318" stroke="#1c1917" stroke-width="2" stroke-dasharray="4,4" />
        <line x1="135" y1="65" x2="135" y2="318" stroke="#0f0d0c" stroke-width="2" />

        <!-- GRANDES ANÉIS DE FERRO COSTURADOS INDIVIDUALMENTE (A marca registrada da Ring Mail) -->
        <!-- Fileira 1 -->
        <circle cx="100" cy="90" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="135" cy="95" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="170" cy="90" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />

        <!-- Fileira 2 -->
        <circle cx="85" cy="130" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="118" cy="135" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="152" cy="135" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="185" cy="130" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />

        <!-- Fileira 3 -->
        <circle cx="100" cy="175" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="135" cy="180" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="170" cy="175" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />

        <!-- Fileira 4 -->
        <circle cx="85" cy="220" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="118" cy="225" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="152" cy="225" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="185" cy="220" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />

        <!-- Fileira 5 -->
        <circle cx="100" cy="265" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="135" cy="270" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />
        <circle cx="170" cy="265" r="12" fill="none" stroke="url(#steelGrad)" stroke-width="4.5" />

        <!-- Tiras de fixação de couro e rebites centrais prendendo cada anel -->
        <circle cx="100" cy="90" r="3" fill="url(#brassGrad)" />
        <circle cx="135" cy="95" r="3" fill="url(#brassGrad)" />
        <circle cx="170" cy="90" r="3" fill="url(#brassGrad)" />
        <circle cx="85" cy="130" r="3" fill="url(#brassGrad)" />
        <circle cx="118" cy="135" r="3" fill="url(#brassGrad)" />
        <circle cx="152" cy="135" r="3" fill="url(#brassGrad)" />
        <circle cx="185" cy="130" r="3" fill="url(#brassGrad)" />
        <circle cx="100" cy="175" r="3" fill="url(#brassGrad)" />
        <circle cx="135" cy="180" r="3" fill="url(#brassGrad)" />
        <circle cx="170" cy="175" r="3" fill="url(#brassGrad)" />
        <circle cx="85" cy="220" r="3" fill="url(#brassGrad)" />
        <circle cx="118" cy="225" r="3" fill="url(#brassGrad)" />
        <circle cx="152" cy="225" r="3" fill="url(#brassGrad)" />
        <circle cx="185" cy="220" r="3" fill="url(#brassGrad)" />
        <circle cx="100" cy="265" r="3" fill="url(#brassGrad)" />
        <circle cx="135" cy="270" r="3" fill="url(#brassGrad)" />
        <circle cx="170" cy="265" r="3" fill="url(#brassGrad)" />

        <!-- Fivelas duplas de cinto na cintura -->
        <rect x="70" y="240" width="130" height="10" fill="#291206" />
        <rect x="120" y="237" width="30" height="16" fill="none" stroke="url(#brassGrad)" stroke-width="3" rx="2" />
      </g>
    </svg>