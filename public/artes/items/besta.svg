<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      <!-- Brilho quente de fundo -->
      <circle cx="150" cy="180" r="100" fill="#f97316" opacity="0.08" filter="url(#forgeGlow)" />
      
      <g filter="url(#dropShadow)" transform="rotate(-15 150 200)">
        <!-- Estribo de ferro na ponta -->
        <path d="M 135 40 C 135 25, 165 25, 165 40 L 165 60 L 135 60 Z" fill="none" stroke="url(#steelGrad)" stroke-width="5" stroke-linecap="round" />

        <!-- Arco transversal de aço recurvado (Prod / Bow) -->
        <path d="M 30 110 Q 150 45 270 110" fill="none" stroke="url(#steelGrad)" stroke-width="12" stroke-linecap="round" />
        <path d="M 35 110 Q 150 50 265 110" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.6" />

        <!-- Ponteiras do arco -->
        <circle cx="32" cy="110" r="7" fill="url(#brassGrad)" />
        <circle cx="268" cy="110" r="7" fill="url(#brassGrad)" />

        <!-- Coronha de madeira (Stock / Tiller) -->
        <path d="M 140 55 L 160 55 L 164 260 C 165 310, 160 340, 150 365 C 140 340, 135 310, 136 260 Z" fill="url(#woodGrad)" stroke="#1c1917" stroke-width="2" />
        
        <!-- Canaleta de aço central para o virote -->
        <rect x="146" y="60" width="8" height="150" fill="url(#darkSteel)" rx="2" />

        <!-- Corda de tendão esticada presa na noz -->
        <line x1="32" y1="110" x2="150" y2="190" stroke="#fde047" stroke-width="2.5" opacity="0.9" />
        <line x1="268" y1="110" x2="150" y2="190" stroke="#fde047" stroke-width="2.5" opacity="0.9" />

        <!-- Mecanismo de disparo / Noz de ferro & Gatilho -->
        <circle cx="150" cy="190" r="8" fill="url(#brassGrad)" />
        <path d="M 150 220 C 145 240, 138 250, 142 265" fill="none" stroke="url(#steelGrad)" stroke-width="4" stroke-linecap="round" />
        <!-- Guarda-mato -->
        <path d="M 140 215 C 130 235, 130 260, 145 275" fill="none" stroke="url(#brassGrad)" stroke-width="3" />

        <!-- Virote (Quarrel / Bolt) encaixado -->
        <rect x="148" y="70" width="4" height="120" fill="#78350f" />
        <!-- Ponta perfurante em forma de pirâmide -->
        <polygon points="150,50 144,72 156,72" fill="url(#steelGrad)" />
        <!-- Penas estabilizadoras de couro no virote -->
        <polygon points="144,175 148,160 148,185" fill="#b91c1c" />
        <polygon points="156,175 152,160 152,185" fill="#b91c1c" />

        <!-- Placas de reforço de latão na coronha -->
        <rect x="139" y="85" width="22" height="10" fill="url(#brassGrad)" rx="2" />
        <circle cx="143" cy="90" r="1.5" fill="#1c1917" />
        <circle cx="157" cy="90" r="1.5" fill="#1c1917" />
      </g>
    </svg>