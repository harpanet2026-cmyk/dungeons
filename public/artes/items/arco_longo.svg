<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
      
  <defs>
    <!-- Gradiente de Fundo Dark Fantasy com vinheta -->
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1a24" />
      <stop offset="60%" stop-color="#0e0d14" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Gradientes de Metal de Aço Polido -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4f8" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gradiente de Madeira Escura / Couro -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="70%" stop-color="#271105" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c2c16" />
      <stop offset="60%" stop-color="#381a0d" />
      <stop offset="100%" stop-color="#1f0d06" />
    </linearGradient>

    <!-- Gradiente de Bronze / Ouro Envelhecido -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Filtro de Brilho / Glow de Forja -->
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

      <rect width="300" height="400" fill="url(#bgVignette)" />
      <circle cx="150" cy="200" r="100" fill="#10b981" opacity="0.05" filter="url(#forgeGlow)" />

      <g filter="url(#dropShadow)" transform="rotate(-15 150 200)">
        <!-- Curvatura nobre do arco de teixo (Recurve Longbow) -->
        <path d="M 110 30 Q 70 120 90 200 Q 70 280 110 370" fill="none" stroke="url(#woodGrad)" stroke-width="10" stroke-linecap="round" />
        <path d="M 108 30 Q 68 120 88 200 Q 68 280 108 370" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.4" />

        <!-- Ponteiras de chifre nas extremidades -->
        <path d="M 110 30 L 115 22" stroke="url(#brassGrad)" stroke-width="6" stroke-linecap="round" />
        <path d="M 110 370 L 115 378" stroke="url(#brassGrad)" stroke-width="6" stroke-linecap="round" />

        <!-- Corda de arco tensionada esticada -->
        <line x1="115" y1="24" x2="115" y2="376" stroke="#f8fafc" stroke-width="2" opacity="0.85" />

        <!-- Empunhadura central de couro costurado -->
        <rect x="83" y="180" width="14" height="40" fill="url(#leatherGrad)" rx="3" stroke="#1c0f08" stroke-width="1.5" />
        <line x1="83" y1="190" x2="97" y2="190" stroke="#fef08a" stroke-width="1" />
        <line x1="83" y1="200" x2="97" y2="200" stroke="#fef08a" stroke-width="1" />
        <line x1="83" y1="210" x2="97" y2="210" stroke="#fef08a" stroke-width="1" />

        <!-- Flecha apoiada na corda pronta para tiro -->
        <line x1="75" y1="198" x2="225" y2="198" stroke="#78350f" stroke-width="3" />
        <polygon points="238,198 222,193 222,203" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="1" />
        <!-- Penas da flecha -->
        <polygon points="85,198 100,192 105,198" fill="#e2e8f0" />
        <polygon points="85,198 100,204 105,198" fill="#e2e8f0" />
      </g>
    </svg>